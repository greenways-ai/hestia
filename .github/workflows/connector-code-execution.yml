name: Connector code execution

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'
      - 'chat/**'
      - 'codex/**'
      - 'copilot/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      architecture: ${{ steps.scope.outputs.architecture }}
      browser: ${{ steps.scope.outputs.browser }}
      services: ${{ steps.scope.outputs.services }}
      ledger: ${{ steps.scope.outputs.ledger }}
      website: ${{ steps.scope.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the committed connector contract
        run: |
          bash -n scripts/connector/detect-code-scope scripts/connector/run-code
          scripts/connector/detect-code-scope --self-test
      - name: Select executable scopes
        id: scope
        env:
          CONNECTOR_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          CONNECTOR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: scripts/connector/detect-code-scope

  architecture:
    needs: contract
    if: needs.contract.outputs.architecture == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute architecture scope
        run: scripts/connector/run-code architecture
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/architecture.txt <<EOF
          repository=greenways-ai/hestia
          scope=architecture
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code architecture
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-architecture-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/architecture.txt
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: contract
    if: needs.contract.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Execute browser scope
        run: scripts/connector/run-code browser
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/browser.txt <<EOF
          repository=greenways-ai/hestia
          scope=browser
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code browser
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/browser.txt
          if-no-files-found: error
          retention-days: 14

  services:
    needs: contract
    if: needs.contract.outputs.services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            services/signaling/package-lock.json
            services/agent-gateway/package-lock.json
            cloudflare/signaling/package-lock.json
      - name: Execute services scope
        run: scripts/connector/run-code services
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/services.txt <<EOF
          repository=greenways-ai/hestia
          scope=services
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code services
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-services-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/services.txt
          if-no-files-found: error
          retention-days: 14

  ledger:
    needs: contract
    if: needs.contract.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute ledger scope
        run: scripts/connector/run-code ledger
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/ledger.txt <<EOF
          repository=greenways-ai/hestia
          scope=ledger
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code ledger
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/ledger.txt
          if-no-files-found: error
          retention-days: 14

  website:
    needs: contract
    if: needs.contract.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Execute website scope
        run: scripts/connector/run-code website
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/website.txt <<EOF
          repository=greenways-ai/hestia
          scope=website
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code website
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-website-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/website.txt
          if-no-files-found: error
          retention-days: 14

  evidence-gate:
    if: always()
    needs:
      - contract
      - architecture
      - browser
      - services
      - ledger
      - website
    runs-on: ubuntu-latest
    steps:
      - name: Require a truthful connector result
        env:
          CONTRACT: ${{ needs.contract.result }}
          ARCHITECTURE: ${{ needs.architecture.result }}
          BROWSER: ${{ needs.browser.result }}
          SERVICES: ${{ needs.services.result }}
          LEDGER: ${{ needs.ledger.result }}
          WEBSITE: ${{ needs.website.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT" = success
          for result in "$ARCHITECTURE" "$BROWSER" "$SERVICES" "$LEDGER" "$WEBSITE"; do
            case "$result" in
              success|skipped) ;;
              *) echo "unexpected connector scope result: $result" >&2; exit 1 ;;
            esac
          done
