name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            browser/package-lock.json
            services/signaling/package-lock.json
      - run: npm ci
        working-directory: browser
      - run: npm test
        working-directory: browser
      - run: npm ci
        working-directory: services/signaling
      - run: npm test
        working-directory: services/signaling
