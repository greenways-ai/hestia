name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce gw.* HAL namespaces
        run: |
          if grep -R --include='*.hal' -nE '^\(ns[[:space:]]+greenways\.|:namespace[[:space:]]+"greenways\.' .; then
            echo 'HAL namespace declarations must use gw.*' >&2
            exit 1
          fi
      - name: Enforce the Hestia/Ignatius boundary
        run: make boundary-check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            browser/package-lock.json
            cloudflare/signaling/package-lock.json
            services/agent-gateway/package-lock.json
            services/signaling/package-lock.json
            site/package-lock.json
      - run: npm ci
        working-directory: browser
      - run: npm test
        working-directory: browser
      - run: npm ci
        working-directory: services/signaling
      - run: npm test
        working-directory: services/signaling
      - run: npm ci
        working-directory: services/agent-gateway
      - run: npm test
        working-directory: services/agent-gateway
      - run: npm ci
        working-directory: cloudflare/signaling
      - run: npm test
        working-directory: cloudflare/signaling
      - run: npm run check
        working-directory: cloudflare/signaling
      - run: npm run build:pages
        working-directory: browser
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium firefox
        working-directory: browser
      - run: npm run test:e2e
        working-directory: browser

  postgres-agent-records:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify HCP1 import and signed receipts in PostgreSQL
        run: bash scripts/test-agent-record-verification

  postgres-agent-rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Admit a signed external agent and rotate the room epoch
        run: bash scripts/test-agent-room-membership-admission

  postgres-agent-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Admit a signed room through the local HTTP gateway
        run: bash scripts/test-agent-gateway
