name: agent-room-hotfix

on:
  push:
    branches:
      - agent/add-canonical-host-redirects

permissions:
  contents: write

concurrency:
  group: agent-room-hotfix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bind counter-offers to the prior signed record root
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("browser/rooms/app.js")
          source = path.read_text()
          old = """    supersedes: previous.record.body.offer_id
            });"""
          new = """    supersedes: previous.record.root
            });"""

          if new in source and old not in source:
              print("Agent room counter-offer binding is already fixed.")
          elif source.count(old) == 1:
              path.write_text(source.replace(old, new, 1))
              print("Updated the counter-offer record binding.")
          else:
              raise SystemExit(
                  f"Expected exactly one counter-offer call site, found {source.count(old)}"
              )
          PY

      - name: Commit the source fix
        run: |
          if git diff --quiet -- browser/rooms/app.js; then
            exit 0
          fi
          git config user.name "greenways-ci"
          git config user.email "actions@users.noreply.github.com"
          git add browser/rooms/app.js
          git commit -m "fix(browser): bind counter-offers to the prior record root"
          git push origin "HEAD:${GITHUB_REF}"
