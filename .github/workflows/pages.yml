name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: site
      - name: Verify the deploy-owned social preview
        run: |
          test -s site/dist/assets/og-hestia.jpg
          grep -q 'https://oss.greenways.ai/hestia/assets/og-hestia.jpg' site/dist/index.html
          ! grep -q 'visual-language/assets/og-hestia' site/dist/index.html
      - run: node browser/scripts/build-pages.mjs
      - name: Add browser products to the site artifact
        run: |
          cp -R .pages/recovery site/dist/recovery
          cp -R .pages/recovery site/dist/recovery-demo
          cp -R .pages/rooms site/dist/rooms
          cp -R .pages/hestia-browser site/dist/hestia-browser
          cp -R .pages/hara-runtime site/dist/hara-runtime
          cp -R .pages/hara site/dist/hara
      - name: Add legacy-host redirects to browser products
        run: node site/scripts/inject-legacy-host-redirect.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: site/dist }
      - uses: actions/deploy-pages@v4
        id: deployment
