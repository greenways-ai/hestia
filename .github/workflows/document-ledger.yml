name: document-ledger

on:
  pull_request:
    paths:
      - "browser/src/document-*.js"
      - "browser/test/document-*.test.mjs"
      - "protocol/document-ot.js"
      - "services/agent-gateway/src/document-*.mjs"
      - "services/agent-gateway/src/postgres-document.mjs"
      - "services/agent-gateway/test/document-*.test.mjs"
      - "services/agent-gateway/test-support/document-*.mjs"
      - "gwdb-ledger-hal/src/gw/ledger/document_ot.hal"
      - "migrations/*document_ot*.sql"
      - "migrations/*document_pack*.sql"
      - "scripts/test-document-ledger-gateway"
      - "docs/document-protocol-v1.md"
  push:
    branches: [main]
    paths:
      - "browser/src/document-*.js"
      - "browser/test/document-*.test.mjs"
      - "protocol/document-ot.js"
      - "services/agent-gateway/src/document-*.mjs"
      - "services/agent-gateway/src/postgres-document.mjs"
      - "services/agent-gateway/test/document-*.test.mjs"
      - "services/agent-gateway/test-support/document-*.mjs"
      - "gwdb-ledger-hal/src/gw/ledger/document_ot.hal"
      - "migrations/*document_ot*.sql"
      - "migrations/*document_pack*.sql"
      - "scripts/test-document-ledger-gateway"
      - "docs/document-protocol-v1.md"

permissions:
  contents: read

jobs:
  document-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            browser/package-lock.json
            services/agent-gateway/package-lock.json
      - run: npm ci
        working-directory: browser
      - run: node --test test/document-*.test.mjs
        working-directory: browser
      - run: npm ci
        working-directory: services/agent-gateway
      - run: node --test test/document-*.test.mjs
        working-directory: services/agent-gateway
      - name: Admit two signed document revisions through HTTP and PostgreSQL
        run: bash scripts/test-document-ledger-gateway
      - name: Upload document-ledger failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: document-ledger-diagnostics
          path: .hestia/document-ledger-diagnostics
          if-no-files-found: warn
          retention-days: 3
