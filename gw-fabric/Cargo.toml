[package]
name = "gw-fabric"
version = "0.1.0"
edition = "2021"
description = "Redis-like coordination fabric for isolated Hara sessions and Wasm modules"
license = "EPL-2.0"
rust-version = "1.78"

[dependencies]
hara-wasm = { path = "../../hara.lang/rust" }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"

[[bin]]
name = "gw-fabric"
path = "src/main.rs"

[[bin]]
name = "gw-fabric-benchmark"
path = "src/bin/gw-fabric-benchmark.rs"
