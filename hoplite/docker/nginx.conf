events {}

http {
    include mime.types;
    default_type application/octet-stream;
    hoplite_bootstrap /etc/hestia/app.hal;

    server {
        listen 8080;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /health {
            hoplite_content hestia.origin/health;
        }

        location /inspect {
            hoplite_content hestia.origin/inspect;
        }

        location = /recovery {
            return 308 /recovery/;
        }

        location /recovery/ {
            alias /opt/hestia/browser/demo/;
            index index.html;
            try_files $uri $uri/ /recovery/index.html;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self' ws: wss:; form-action 'none'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /hestia-browser/ {
            alias /opt/hestia/browser/src/;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /signal {
            proxy_pass http://signaling:8443;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;
        }
    }
}
