<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hestia sigil">
  <style>
    :root{--ground:#fbfaf6;--line:rgba(12,59,46,.34);--grout:#d5d0c5;--outer:#641b27;--inner:#8e2731;--ember:#e66d42}
